# Azure Developer CLI (azd) configuration. Deploy with:  azd up
# See README > Deploying to Azure.
name: family
services:
  api:
    project: ./api
    language: js
    host: containerapp
    # Built in the container registry from the repo root (the API needs shared/ and db/).
    docker:
      path: ../Dockerfile
      context: ..
      remoteBuild: true
  web:
    project: ./web
    language: js
    host: staticwebapp
    dist: dist
    hooks:
      # The web app imports @mealplanner/shared, so rebuild it first (a project-level
      # hook doesn't run on `azd deploy`). npm install, not npm ci: ci would wipe
      # node_modules while other services may be packaging in parallel. The API is
      # built separately, inside its Docker image.
      prepackage:
        shell: sh
        run: cd .. && npm install --no-audit --no-fund && npm run build --workspace shared
# What `azd pipeline config` copies from the azd environment into GitHub for the
# "Deploy to production" workflow (.github/workflows/azure-dev.yml).
pipeline:
  variables:
    - GOOGLE_CLIENT_ID
    - RECIPE_MODEL
  secrets:
    - POSTGRES_ADMIN_PASSWORD
    - ANTHROPIC_API_KEY
    - GOOGLE_PLACES_API_KEY
