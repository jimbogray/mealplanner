name: Promote to production

# Deploys what is on staging to production: the same API image (by digest) and the same web
# build, from a successful "Deploy to staging" run. The production environment's required
# reviewer approves the deploy job before it runs.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Deploy to staging run id to promote (leave blank for the latest successful one)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      sha: ${{ steps.run.outputs.sha }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - name: Find the staging run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy-staging.yml --branch main \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$RUN_ID" ] || { echo "::error::No successful staging deploy found"; exit 1; }
          fi
          run=$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json workflowName,conclusion,headBranch,headSha,url)
          echo "$run"
          echo "$run" | jq -e '.workflowName == "Deploy to staging" and .conclusion == "success" and .headBranch == "main"' >/dev/null \
            || { echo "::error::Run $RUN_ID is not a successful Deploy to staging run on main"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$run" | jq -r .headSha)" >> "$GITHUB_OUTPUT"
          echo "Promoting $(echo "$run" | jq -r .headSha) from $(echo "$run" | jq -r .url)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v4
        with:
          name: release
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Read release
        id: release
        run: echo "image=$(jq -r .image release.json)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.web-url }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy-to-azure
        with:
          environment: production
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          image: ${{ needs.resolve.outputs.image }}
          web-dist: web-dist
          google-client-id: ${{ vars.GOOGLE_CLIENT_ID }}
